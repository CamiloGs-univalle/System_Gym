<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="robots" content="noindex, nofollow">
  <title>System Gym · Panel</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Login -->
  <main id="vista-login" class="login" hidden>
    <form id="form-login" class="login-card" autocomplete="on">
      <div class="logo" aria-hidden="true">SG</div>
      <h1>Panel del gimnasio</h1>
      <p class="muted">Consulta tu gimnasio desde cualquier lugar.</p>
      <label>Usuario
        <input name="usuario" autocomplete="username" required autocapitalize="none">
      </label>
      <label>Contraseña
        <input name="clave" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </main>

  <!-- Panel -->
  <div id="vista-panel" class="app" hidden>
    <header class="top">
      <div class="top-row">
        <div class="top-title">
          <h1 id="gym-nombre">Mi gimnasio</h1>
          <p id="sync-estado" class="sync"></p>
        </div>
        <div class="top-actions">
          <button id="btn-recargar" class="icon-btn" aria-label="Actualizar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          </button>
          <button id="btn-salir" class="icon-btn" aria-label="Cerrar sesión">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg>
          </button>
        </div>
      </div>
      <div id="aviso" class="aviso" hidden></div>
    </header>

    <section id="contenido" class="contenido" aria-live="polite"></section>

    <nav class="tabs" aria-label="Secciones">
      <button data-tab="resumen" class="tab active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z"/></svg>
        <span>Resumen</span>
      </button>
      <button data-tab="caja" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v12H3zM3 11h18M7 15h3"/></svg>
        <span>Caja</span>
      </button>
      <button data-tab="clientes" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM21 19v-1a4 4 0 0 0-3-3.9M16 3.1a3.5 3.5 0 0 1 0 6.8"/></svg>
        <span>Clientes</span>
      </button>
      <button data-tab="nomina" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/></svg>
        <span>Nómina</span>
      </button>
      <button data-tab="mas" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span>Más</span>
      </button>
    </nav>
  </div>

  <div id="cargando" class="cargando"><div class="spinner"></div></div>
</body>
</html>
